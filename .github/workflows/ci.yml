name: EJC CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ejc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Packages (@ejc/types, @ejc/validation)
        run: |
          pnpm --filter @ejc/types run build
          pnpm --filter @ejc/validation run build

      - name: Generate Prisma Client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/ejc_test?schema=public"

      - name: Run Tests
        run: pnpm test
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/ejc_test?schema=public"
          JWT_SECRET: "test-secret-key-at-least-32-characters-long"
          JWT_REFRESH_SECRET: "test-refresh-secret-key-at-least-32-characters"

      - name: Build Applications
        run: pnpm build
