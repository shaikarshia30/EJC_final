apiVersion: v1
kind: Namespace
metadata:
  name: ejc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ejc-config
  namespace: ejc
data:
  NODE_ENV: "production"
  PORT: "4000"
  AI_CHAT_MODEL: "google/gemini-2.5-flash"
  AI_EMBEDDING_MODEL: "text-embedding-3-small"
---
apiVersion: v1
kind: Secret
metadata:
  name: ejc-secrets
  namespace: ejc
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:postgrespassword@postgres.ejc.svc.cluster.local:5432/ejc_db?schema=public"
  JWT_SECRET: "ejc-enterprise-jwt-super-secret-key-32-chars-min"
  JWT_REFRESH_SECRET: "ejc-enterprise-jwt-refresh-super-secret-key-min"
  AI_API_KEY: "change-in-production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ejc-api
  namespace: ejc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ejc-api
  template:
    metadata:
      labels:
        app: ejc-api
    spec:
      containers:
        - name: api
          image: ejc-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: ejc-config
            - secretRef:
                name: ejc-secrets
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ejc-api-service
  namespace: ejc
spec:
  type: ClusterIP
  selector:
    app: ejc-api
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ejc-web
  namespace: ejc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ejc-web
  template:
    metadata:
      labels:
        app: ejc-web
    spec:
      containers:
        - name: web
          image: ejc-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ejc-web-service
  namespace: ejc
spec:
  type: ClusterIP
  selector:
    app: ejc-web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ejc-ingress
  namespace: ejc
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: ejc.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ejc-api-service
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ejc-web-service
                port:
                  number: 80
